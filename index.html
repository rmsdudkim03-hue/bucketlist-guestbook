<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>our momi MAP</title>
<meta name="description" content="전시 방명록 — 하고 싶은 일을 모양과 색으로, 나의 모미 남기기">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 로딩 화면: 도형이 바닥에 튕기고 올라가며 네모 → 동그라미 → 세모로 서서히 바뀜 (loader.js) -->
<div class="loader" id="loader" role="status" aria-label="불러오는 중">
  <img class="loader-logo" src="assets/logo.svg" alt="our momi MAP">
  <div class="loader-stage">
    <span class="loader-shadow"></span>
    <svg class="loader-shape" viewBox="-40 -40 80 80" aria-hidden="true"><path stroke-width="4" stroke-linejoin="round"/></svg>
  </div>
</div>
<!-- 첫 안내 화면 2장 (피그마 'iPhone 17 - 1', 'iPhone 17 - 7'). 강조 낱말에 형광펜 밑줄이 그어짐 (intro.js) -->
<section class="intro" id="intro">
  <img class="loader-logo" src="assets/logo.svg" alt="our momi MAP">
  <p class="intro-text s1">여러분이 <mark class="x">하고 싶은 일</mark>은<br>무엇인가요?</p>
  <p class="intro-text s2">여러분의 <mark>모미</mark>를 남겨주세요 !</p>
  <button class="intro-btn" id="introGo" type="button">모미 남기기</button>
</section>

<!-- 모두의 판 (피그마 'iPhone 17 - 9', '- 11'): 칸 위에 모미가 모여 있고, 손가락으로 끌어서 둘러봄. 모미를 누르면 글 -->
<section class="map" id="map" aria-label="모두의 모미">
  <div class="world" id="world"></div>
</section>
<img class="map-logo" src="assets/logo.svg" alt="our momi MAP">
<p class="count" id="count"></p>
<p class="note" id="note"></p>
<button class="cta" id="open" type="button">모미 작성하기</button>

<!-- 모미 쓰기 시트 (피그마 'iPhone 17 - 12', '- 8'): 모양·색 고르고, 내용·이름 쓰기 -->
<div class="sheet-dim" id="sheetDim" hidden></div>
<form class="sheet down" id="sheet" autocomplete="off" aria-label="모미 쓰기" inert>
  <span class="handle" aria-hidden="true"></span>
  <button class="back" id="close" type="button" aria-label="닫기">←</button>
  <div class="title"><span class="who" id="who"></span><img src="assets/s-momi.svg" alt="'s momi"></div>
  <div class="preview" id="preview"></div>
  <div class="shapes" id="shapes" role="radiogroup" aria-label="모양"></div>
  <div class="colors" id="colors" role="radiogroup" aria-label="색"></div>
  <label class="sr" for="text">하고 싶은 일</label>
  <input class="field" id="text" maxlength="80" placeholder="내용을 입력해주세요." enterkeyhint="next">
  <label class="sr" for="name">이름</label>
  <input class="field" id="name" maxlength="12" placeholder="이름 (선택)" enterkeyhint="done">
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <button class="send" id="send" type="submit" disabled>모미 작성하기</button>
</form>

<!-- 작성 완료 알림 (피그마 'iPhone 17 - 10'): 체크 모션이 끝나면 잠깐 떴다가 사라짐 -->
<div class="toast" id="toast" role="status" hidden>
  <svg viewBox="0 0 25 25" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="#fff"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12.5 0C5.59659 0 0 5.59659 0 12.5C0 19.4034 5.59659 25 12.5 25C19.4034 25 25 19.4034 25 12.5C25 5.59659 19.4034 0 12.5 0ZM17.9182 10.3864C18.018 10.2723 18.0939 10.1395 18.1416 9.99565C18.1892 9.85182 18.2077 9.6999 18.1958 9.54885C18.1839 9.39779 18.1419 9.25064 18.0722 9.11605C18.0026 8.98147 17.9068 8.86216 17.7904 8.76516C17.674 8.66816 17.5394 8.59541 17.3944 8.55121C17.2495 8.507 17.0972 8.49223 16.9465 8.50776C16.7957 8.52329 16.6496 8.5688 16.5168 8.64163C16.3839 8.71445 16.2669 8.81312 16.1727 8.93182L11.2864 14.7943L8.75795 12.2648C8.54363 12.0578 8.25659 11.9432 7.95864 11.9458C7.66068 11.9484 7.37567 12.0679 7.16498 12.2786C6.95429 12.4893 6.83478 12.7743 6.83219 13.0723C6.8296 13.3702 6.94414 13.6573 7.15114 13.8716L10.5602 17.2807C10.6719 17.3923 10.8056 17.4794 10.9527 17.5364C11.0999 17.5935 11.2574 17.6193 11.4151 17.6121C11.5728 17.6049 11.7272 17.565 11.8686 17.4948C12.0101 17.4247 12.1353 17.3258 12.2364 17.2045L17.9182 10.3864Z" fill="#333"/></svg>
  <span>모미 작성이 완료됐습니다!</span>
</div>

<!-- 판에서 모미를 눌렀을 때 -->
<div class="card" id="card" hidden>
  <div class="card-box" role="dialog" aria-modal="true">
    <div class="title"><span class="who" id="cardWho"></span><img src="assets/s-momi.svg" alt="'s momi"></div>
    <div class="big" id="cardBig"></div>
  </div>
</div>

<script src="loader.js"></script>
<script src="intro.js"></script>
<script src="app.js"></script>
</body>
</html>
