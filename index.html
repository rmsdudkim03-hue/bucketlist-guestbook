<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c7c6c7">
<title>BUCKET LIST</title>
<meta name="description" content="전시 방명록 — 색과 모양을 골라 나의 버킷리스트 한 줄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 로딩 화면: 도형이 바닥에 튕기고 올라가며 네모 → 동그라미 → 세모로 서서히 바뀜 (loader.js) -->
<div class="loader" id="loader" role="status" aria-label="불러오는 중">
  <img class="loader-logo" src="assets/logo.svg" alt="our momi MAP">
  <div class="loader-stage">
    <span class="loader-shadow"></span>
    <svg class="loader-shape" viewBox="-40 -40 80 80" aria-hidden="true"><path stroke-width="4" stroke-linejoin="round"/></svg>
  </div>
</div>
<main class="page">
  <header class="head">
    <h1>BUCKET LIST</h1>
    <p class="count" id="count"></p>
  </header>

  <!-- 모두의 버킷리스트: 격자 판 위에 도형으로. 도형을 누르면 글이 보임 -->
  <section class="board" id="board" aria-label="모두의 버킷리스트">
    <div class="layer shadows" id="shadows"></div>
    <div class="layer pieces" id="pieces"></div>
  </section>
  <p class="empty" id="empty" hidden>아직 남긴 글이 없어요.<br>첫 번째 도형을 놓아 주세요.</p>
  <p class="note" id="note"></p>
</main>

<button class="cta" id="open">나도 남기기</button>

<!-- 쓰기 화면: 색 6개 + 모양 3개 고르고 한 줄 쓰기 -->
<section class="sheet" id="sheet" hidden aria-label="버킷리스트 쓰기">
  <form class="write" id="write" autocomplete="off">
    <button type="button" class="close" id="close" aria-label="닫기">×</button>
    <h2>나의 버킷리스트</h2>
    <p class="guide">색과 모양을 하나씩 골라 주세요.</p>

    <div class="pick">
      <div class="colors" id="colors" role="radiogroup" aria-label="색"></div>
      <div class="shapes" id="shapes" role="radiogroup" aria-label="모양"></div>
    </div>

    <label class="sr" for="text">버킷리스트</label>
    <textarea id="text" rows="2" maxlength="80" placeholder="살면서 꼭 해 보고 싶은 일 하나 (예: 오로라 보러 가기)"></textarea>
    <div class="row">
      <label class="sr" for="name">이름</label>
      <input id="name" maxlength="12" placeholder="이름 (선택)">
      <span class="len" id="len">0/80</span>
    </div>
    <button type="submit" class="send" id="send" disabled>남기기</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</section>

<!-- 도형을 눌렀을 때 보이는 글 -->
<div class="card" id="card" hidden>
  <div class="card-box" role="dialog" aria-modal="true">
    <span class="card-shape" id="cardShape"></span>
    <p class="card-text" id="cardText"></p>
    <small class="card-meta" id="cardMeta"></small>
  </div>
</div>

<script src="loader.js"></script>
<script src="app.js"></script>
</body>
</html>
